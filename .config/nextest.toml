nextest-version = "0.9.143"

# CI keeps the full default inventory but makes every test a separately managed
# process. A timeout remains a failure; retries are deliberately disabled so a
# green run never conceals a deterministic lifecycle or storage failure.
[profile.ci]
default-filter = "all()"
fail-fast = false
retries = 0
flaky-result = "fail"
slow-timeout = { period = "5m", terminate-after = 2, grace-period = "30s", on-timeout = "fail" }
global-timeout = "4h"
status-level = "slow"
final-status-level = "slow"

# The Windows fixture families use process isolation. Nextest can schedule
# those processes concurrently, while each selected test runs on one libtest
# thread so same-process fixture leases cannot contend.
[profile.ci-windows]
inherits = "ci"
run-extra-args = ["--test-threads=1"]
