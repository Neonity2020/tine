<!doctype html>
<html lang="en" data-theme="light" data-color="logseq">
  <head><meta name="tine-published" content="snapshot.json">
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Tine Guide</title>
    <style id="tine-startup-style">
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      html,
      body {
        background: var(--bg-primary, #ffffff);
        color: var(--text-primary, #374151);
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: var(--bg-primary, #1a1b1e);
        color: var(--text-primary, #d1d5db);
      }
      .startup-shell {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font: 500 14px/1.4 system-ui, sans-serif;
      }
      .startup-shell-mark {
        width: 15px;
        height: 15px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: tine-startup-spin 0.8s linear infinite;
      }
      @keyframes tine-startup-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-shell-mark { animation: none; }
      }
    </style>
    <script>
      try {
        const preference = localStorage.getItem("logseq-claude.theme");
        const dark = preference === "dark" ||
          (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (_) {
        // The deterministic light default on <html> remains usable.
      }
    </script>
    <script type="module" crossorigin src="./assets/main-Tfpk-fZA.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/app-BYCHaYoJ.js">
    <link rel="stylesheet" crossorigin href="./assets/app-B3tai_P5.css">
    <link rel="stylesheet" crossorigin href="./assets/main-UdLNOgRp.css">
  </head>
  <body>
    <div id="root">
      <div class="startup-shell" role="status" aria-live="polite">
        <span class="startup-shell-mark" aria-hidden="true"></span>
        <span>Opening Tine…</span>
      </div>
    </div>
  </body>
</html>
