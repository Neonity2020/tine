# Build Tine installers for Linux, macOS (universal), and Windows as an immutable
# candidate, or promote an already-verified candidate across an explicitly
# allowlisted proof-only delta. Releases are manual: use build mode for an exact
# product candidate and promote mode only when the proof-reuse guard accepts the
# source/target pair. Set publish only on a tag ref after the dry run is green.
#
# Publication is atomic at the workflow level: every expensive build writes only
# an immutable workflow artifact; one assembler creates latest.json; and one
# short publisher owns the draft, uploads, remote verification, and publication.
# A platform failure must never expose a partial release (v0.5.5 did exactly that).
#
# Signing: the macOS lane fails closed unless it can sign with Tine's Developer
# ID certificate, notarize with a short-lived App Store Connect API token, and
# validate the stapled ticket. Windows installers remain unsigned for now.
name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a new product candidate, or promote an earlier candidate across a proof-only delta
        type: choice
        options: [build, promote]
        default: build
        required: true
      source_run_id:
        description: Successful no-publication build run to reuse (promote mode only)
        type: string
        required: false
      publish:
        description: Publish after verification (requires a tag ref)
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap deterministic guards run before any expensive release build.
  # The same workflow also calls the real offline Flatpak build below; together
  # these prevent dependency-pin drift from surfacing only after a tag is public.
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Require exact-SHA full CI evidence
        if: inputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVIDENCE_SHA: ${{ github.sha }}
          CI_EVIDENCE_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-ci-evidence.mjs
      - uses: dtolnay/rust-toolchain@1.96.0
        if: inputs.mode == 'build'
      - uses: swatinem/rust-cache@v2
        if: inputs.mode == 'build'
        with:
          workspaces: ". -> target"
      - run: npm ci
      - name: Require updater signing key
        if: inputs.mode == 'build'
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for release smoke and tagged releases."
            exit 1
          fi
      - name: Version, Android code, tag, and changelog agree
        if: inputs.mode == 'build'
        env:
          REQUIRE_RELEASE_READINESS: "1"
        run: node scripts/check-release-preflight.mjs
      - name: Flatpak offline npm sources are current
        if: inputs.mode == 'build'
        run: node scripts/check-flatpak-node-sources.mjs
      - name: Flatpak offline Cargo sources are current
        if: inputs.mode == 'build'
        run: node scripts/check-flatpak-cargo-sources.mjs
      - name: Certified tine-storage pin is current
        if: inputs.mode == 'build'
        run: node scripts/check-storage-pin.mjs
      - name: lsdoc WASM pin is current
        if: inputs.mode == 'build'
        run: node scripts/check-wasm-pin.mjs
      - name: lsdoc oracle bytes and cross-platform EOL policy are current
        if: inputs.mode == 'build'
        run: node scripts/check-lsdoc-oracle-sync.mjs
      - name: Release product and offline-source contract fixtures
        if: inputs.mode == 'build'
        run: |
          node scripts/test-storage-pin.mjs
          node scripts/test-env-toolchain-fallback.mjs
      - name: Release and proof-reuse contract fixtures
        run: node scripts/test-release-pipeline.mjs
      - name: Validate manual release mode
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
        run: |
          if [ "$MODE" = promote ] && ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::promote mode requires a numeric source_run_id"
            exit 1
          fi
          if [ "$MODE" = build ] && [ -n "$SOURCE_RUN_ID" ]; then
            echo "::error::source_run_id is valid only in promote mode"
            exit 1
          fi
          if [ "$PUBLISH" = true ] && [[ "$REF" != refs/tags/* ]]; then
            echo "::error::publication requires dispatching the workflow on a tag ref"
            exit 1
          fi

  # Reuse the actual privileged, network-disabled Flatpak bundle build. It runs
  # in parallel with the platform packages but is a hard publication dependency.
  flatpak:
    needs: preflight
    if: inputs.mode == 'build'
    uses: ./.github/workflows/flatpak.yml

  # Build each desktop platform concurrently. Jobs never mutate a GitHub Release;
  # they upload immutable workflow artifacts for the assembler/publisher below.
  build:
    needs: preflight
    if: inputs.mode == 'build'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - platform: ubuntu-22.04
            lane: linux-x64
            args: "--features custom-protocol"
            rust-targets: ""
            appimage-update-info: "gh-releases-zsync|martinkoutecky|tine|latest|Tine_*_amd64.AppImage.zsync"
          # Linux ARM64: built NATIVELY on GitHub's aarch64 runner (free on public
          # repos). No cross-compile — GTK/WebKitGTK are system libs that are
          # painful to cross-compile, so we install the arm64 -dev packages on the
          # arm runner exactly like the x86 job. Audience: Asahi (fine) + Pi/SBC
          # (will feel WebKitGTK's paint cost). Ships .deb + raw binary (AppImage
          # tooling on ARM is historically flaky, so it's fine if that bundle is skipped).
          - platform: ubuntu-22.04-arm
            lane: linux-arm64
            args: "--features custom-protocol"
            rust-targets: ""
            appimage-update-info: "gh-releases-zsync|martinkoutecky|tine|latest|Tine_*_aarch64.AppImage.zsync"
          - platform: macos-latest
            lane: macos-universal
            # one universal binary that runs on both Apple Silicon and Intel
            args: "--target universal-apple-darwin --features custom-protocol"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            lane: windows-x64
            args: "--features custom-protocol"
            rust-targets: ""
            win-arch: x64
            win-exe-dir: target/release
          # Experimental Windows 32-bit pilot (GH #275): cross-compiled on the
          # ordinary Windows runner and published as installer + portable ZIP.
          # It deliberately stays out of latest.json until a reporter proves it
          # on real i686-only hardware, so this does not silently promise an
          # updater/support contract before the device experiment succeeds.
          - platform: windows-latest
            lane: windows-x86
            args: "--target i686-pc-windows-msvc --features custom-protocol"
            rust-targets: "i686-pc-windows-msvc"
            win-arch: x86
            win-exe-dir: target/i686-pc-windows-msvc/release
          # Windows ARM64 (Surface Pro X, Snapdragon X laptops): CROSS-compiled from
          # the x86_64 windows runner. rustup adds the target; the VS 2022 ARM64 MSVC
          # tools are preinstalled on the windows-latest image. A `--target <triple>`
          # build outputs under target/<triple>/release/ (NOT target/release/), which
          # `win-exe-dir` below threads into the portable-zip step. WebView2 exists on
          # Windows ARM64, so the runtime is fine.
          - platform: windows-latest
            lane: windows-arm64
            args: "--target aarch64-pc-windows-msvc --features custom-protocol"
            rust-targets: "aarch64-pc-windows-msvc"
            win-arch: arm64
            win-exe-dir: target/aarch64-pc-windows-msvc/release
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev \
            webkit2gtk-driver xvfb xauth xdotool openbox x11-utils weston zsync

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          # Cargo workspace is the repo ROOT (target/ lives there, not src-tauri/)
          workspaces: ". -> target"

      - run: npm ci

      - name: Install Linux release-suite browser
        if: matrix.lane == 'linux-x64'
        run: npx playwright install --with-deps chromium

      - name: Snapshot Linux E2E candidate inputs
        if: matrix.lane == 'linux-x64'
        run: node scripts/build-e2e-receipt.mjs before --snapshot target/release/tine.build.before.json

      - name: Snapshot Windows E2E candidate inputs
        if: matrix.lane == 'windows-x64'
        run: node scripts/build-e2e-receipt.mjs before --tauri-manifest-normalization --snapshot target/release/tine.exe.build.before.json

      - name: Prepare macOS signing and notarization credentials
        if: matrix.lane == 'macos-universal'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::required macOS signing secret $name is missing"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # macOS 26 no longer reliably infers PKCS#12 input when Tauri asks
          # `security import` to install APPLE_CERTIFICATE itself. Import the
          # Developer ID identity explicitly into a temporary keychain, just as
          # the iOS lane does for its distribution identity, and do not expose
          # APPLE_CERTIFICATE to the later Tauri process.
          keychain="$RUNNER_TEMP/tine-macos-signing.keychain-db"
          p12="$RUNNER_TEMP/tine-macos-developer-id.p12"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          # App notarization is an external queue and has legitimately taken
          # longer than an hour.  Keep the ephemeral keychain unlocked for the
          # whole maximum job lifetime so the later DMG signature cannot block
          # on an invisible password prompt after the app was accepted.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$keychain"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"

          keychains=("$keychain")
          while IFS= read -r listed; do
            listed="${listed//\"/}"
            listed="${listed#"${listed%%[![:space:]]*}"}"
            [ -n "$listed" ] && keychains+=("$listed")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          security find-identity -v -p codesigning "$keychain" |
            grep -Fq "$APPLE_SIGNING_IDENTITY"
          rm -f "$p12"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          key_dir="$RUNNER_TEMP/app-store-connect-private-keys"
          key_path="$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          install -d -m 700 "$key_dir"
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build Tauri bundles
        if: matrix.lane != 'macos-universal'
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
          TINE_RETAIN_SOURCE_MAPS: "1"
          # Updater signing (minisign) — the app-update root of trust, SEPARATE from
          # OS code-signing. REQUIRED once `bundle.createUpdaterArtifacts` is true:
          # the bundler signs each updater artifact with this key, and the installed
          # app verifies against `plugins.updater.pubkey` in tauri.conf.json. Add the
          # two repo secrets (see docs/adr/0011) BEFORE tagging the next release, or
          # the signing step fails. Empty ⇒ signing skipped (fine only while no
          # updater artifacts are produced).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy-plugin-appimage passes this to appimagetool, which embeds
          # the .upd_info section and creates the matching .zsync metadata.
          # Newer plugin builds read LDAI_UPDATE_INFORMATION and only warn on the
          # deprecated UPDATE_INFORMATION; set both so any plugin version embeds it.
          UPDATE_INFORMATION: ${{ matrix.appimage-update-info }}
          LDAI_UPDATE_INFORMATION: ${{ matrix.appimage-update-info }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Build signed and notarized macOS bundles
        if: matrix.lane == 'macos-universal'
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
          TINE_RETAIN_SOURCE_MAPS: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Collect Unix diagnostic symbols
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          out="target/diagnostic-symbols/native/${{ matrix.lane }}"
          mkdir -p "$out"
          if [ "${{ matrix.lane }}" = "macos-universal" ]; then
            binary="target/universal-apple-darwin/release/tine"
            if [ ! -x "$binary" ]; then
              echo "::error::universal Tine binary is missing for diagnostic symbols"
              exit 1
            fi
            dsymutil "$binary" -o "$out/Tine.dSYM"
          else
            binary="target/release/tine"
            if [ ! -x "$binary" ]; then
              echo "::error::native Tine binary is missing for diagnostic symbols"
              exit 1
            fi
            objcopy --only-keep-debug "$binary" "$out/tine.debug"
          fi
          printf '%s\n' "commit=${{ github.sha }}" "lane=${{ matrix.lane }}" > "$out/receipt.txt"

      - name: Collect Windows diagnostic symbols
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $out = "target/diagnostic-symbols/native/${{ matrix.lane }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dir = "${{ matrix.win-exe-dir }}"
          $pdb = @("$dir/Tine.pdb", "$dir/tine.pdb") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $pdb) { throw "native Tine PDB is missing under $dir" }
          Copy-Item $pdb "$out/Tine.pdb"
          @("commit=${{ github.sha }}", "lane=${{ matrix.lane }}") |
            Set-Content -Encoding utf8 "$out/receipt.txt"

      - name: Upload exact diagnostic symbols
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-symbols-${{ matrix.lane }}-${{ github.sha }}
          path: target/diagnostic-symbols
          if-no-files-found: error
          retention-days: 90

      - name: Verify macOS signature and stapled notarization ticket
        if: matrix.lane == 'macos-universal'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg=$(find target -type f -path '*/bundle/dmg/*.dmg' -print -quit)
          if [ -z "$dmg" ]; then
            echo "::error::signed macOS DMG is missing"
            exit 1
          fi

          # Tauri's DMG bundler deliberately removes its temporary standalone
          # .app after embedding it. Verify the actual shipped application,
          # not that transient build path.
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/tine-release-dmg"
          mkdir -p "$mount"
          mounted=0
          cleanup_dmg() {
            if [ "$mounted" -eq 1 ]; then
              hdiutil detach "$mount" || true
            fi
          }
          trap cleanup_dmg EXIT
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly
          mounted=1
          app=$(find "$mount" -maxdepth 2 -type d -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "::error::signed macOS app is missing from the release DMG"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2> "$RUNNER_TEMP/tine-codesign.txt"
          grep -Fq 'Authority=Developer ID Application:' "$RUNNER_TEMP/tine-codesign.txt"
          grep -Fq "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/tine-codesign.txt"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Verify Linux AppImage update information
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "${{ matrix.lane }}" in
            linux-x64) arch=amd64 ;;
            linux-arm64) arch=aarch64 ;;
            *) echo "::error::unexpected Linux release lane: ${{ matrix.lane }}"; exit 1 ;;
          esac
          appimage_dir=./target/release/bundle/appimage
          appimage="$appimage_dir/Tine_${version}_${arch}.AppImage"
          zsync_name="Tine_${version}_${arch}.AppImage.zsync"
          # appimagetool writes the .zsync into the tauri build CWD (src-tauri/),
          # NOT beside the AppImage in the bundle dir. Check the known candidate
          # locations, then fall back to a whole-tree search so a future CWD change
          # cannot silently drop it (that false "missing" was the GH #222 bug).
          zsync_source=""
          for cand in \
            "./src-tauri/$zsync_name" \
            "$appimage_dir/$zsync_name" \
            "./$zsync_name"; do
            if [ -f "$cand" ]; then zsync_source="$cand"; break; fi
          done
          if [ -z "$zsync_source" ]; then
            zsync_source=$(find . -type f -name "$zsync_name" -print -quit 2>/dev/null)
          fi
          if [ -z "$zsync_source" ]; then
            echo "::error::missing AppImage update metadata: $zsync_name"
            exit 1
          fi
          if [ "$zsync_source" != "$appimage_dir/$zsync_name" ]; then
            mv "$zsync_source" "$appimage_dir/$zsync_name"
          fi
          if [ ! -f "$appimage" ] || [ ! -f "$appimage_dir/$zsync_name" ]; then
            echo "::error::AppImage or update metadata is not staged beside the bundle"
            exit 1
          fi
          if ! readelf --string-dump=.upd_info "$appimage" | grep -Fq 'gh-releases-zsync|'; then
            echo "::error::AppImage is missing embedded update information"
            exit 1
          fi

      - name: Write Linux E2E candidate receipt
        if: matrix.lane == 'linux-x64'
        run: node scripts/build-e2e-receipt.mjs after --snapshot target/release/tine.build.before.json --app target/release/tine

      - name: Write Windows E2E candidate receipt
        if: matrix.lane == 'windows-x64'
        run: node scripts/build-e2e-receipt.mjs after --snapshot target/release/tine.exe.build.before.json --app target/release/tine.exe

      # Portable Windows build: the compiled Tauri exe is already self-contained
      # (frontend + lsdoc-wasm are embedded; WebView2Loader is statically linked),
      # so "portable" is just that one exe, zipped. The NSIS installer we also
      # ship wraps this same binary; the portable zip skips the installer AND its
      # WebView2 bootstrapper — WebView2 is preinstalled on Windows 10/11, so this
      # runs for ~everyone, but a machine without the runtime won't launch it.
      - name: Package portable Windows zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          # A cross-target build (ARM64) outputs under target/<triple>/release/, a
          # native build (x64) under target/release/ — matrix.win-exe-dir carries the
          # right one. Tauri v2 may rename the main binary to productName ("Tine.exe");
          # the cargo bin name is "tine.exe". Pick whichever exists — and NOT the
          # secondary "tine-check.exe" helper binary.
          $dir = "${{ matrix.win-exe-dir }}"
          $exe = @("$dir/Tine.exe", "$dir/tine.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "portable: main Tine exe not found under $dir" }
          $zip = "Tine_${version}_${{ matrix.win-arch }}-portable.zip"
          Compress-Archive -Path $exe -DestinationPath $zip -Force

      # The expensive Linux build above is also the exact binary under test and
      # is a hard publication gate. Windows advisory evidence runs independently
      # from the staged portable artifact below so it cannot serialize assembly.
      - name: Install Tauri WebDriver bridge
        if: matrix.lane == 'linux-x64'
        run: cargo install tauri-driver --locked

      # Prove the receipt machinery itself before trusting the receipt that
      # binds the released binary to this exact source revision.
      - name: E2E build-provenance machinery is sound
        if: matrix.lane == 'linux-x64'
        run: npm run test:e2e-provenance

      - name: Gate Linux x64 on the complete real-app regression catalog
        if: matrix.lane == 'linux-x64'
        env:
          E2E_ALLOW_SYNTHETIC_FOCUS: "1"
          TINE_E2E_MODE: release
        run: npm run e2e:linux:release

      - name: Gate Linux x64 on the signed plugin catalogue lifecycle
        if: matrix.lane == 'linux-x64'
        run: npm run e2e:plugins

      - name: Upload release E2E evidence
        if: always() && matrix.lane == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-${{ matrix.lane }}
          path: test-results/e2e
          if-no-files-found: warn
          retention-days: 14

      # The staged Windows smoke jobs verify that the downloaded portable exe
      # embeds this exact production frontend.  Preserve the already-built dist
      # once instead of rebuilding it independently in every advisory job.
      - name: Upload exact Windows x64 frontend proof
        if: matrix.lane == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-frontend-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Upload exact Windows x64 E2E receipt
        if: matrix.lane == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-receipt-windows-x64
          path: target/release/tine.exe.build.json
          if-no-files-found: error
          retention-days: 3

      # Promotion reruns only the proof that changed, but it must exercise the
      # exact old product binary and frontend. Preserve those inputs beside the
      # candidate for the same short three-day promotion window.
      - name: Upload reusable Linux x64 proof input
        if: matrix.lane == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-linux-x64
          path: |
            target/release/tine
            target/release/tine.build.json
            dist
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload reusable Windows x64 proof input
        if: matrix.lane == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-windows-x64
          path: |
            target/release/tine.exe
            target/release/tine.exe.build.json
            dist
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Stage immutable release artifact
        run: node scripts/stage-release-lane.mjs "${{ matrix.lane }}" release-candidate "${{ github.sha }}"

      - name: Upload release lane
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.lane }}
          path: release-candidate/${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Remove macOS signing material
        if: always() && matrix.lane == 'macos-universal'
        shell: bash
        run: |
          if [ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          fi
          rm -rf "$RUNNER_TEMP/app-store-connect-private-keys"
          rm -f "$RUNNER_TEMP/tine-macos-developer-id.p12"
          rm -f "$RUNNER_TEMP/tine-codesign.txt"

  # Advisory Windows scenarios consume the already-staged portable x64 binary.
  # They run on independent hosts and in parallel with candidate assembly, so a
  # bad runner neither cascades into 0/N evidence nor delays atomic publication.
  # Job-level continue-on-error keeps the advisory policy while leaving each
  # scenario's real failure visible instead of turning one 0/N step green.
  windows-smoke:
    needs: [preflight, build]
    # A failure in another build-matrix lane (for example the hard Linux E2E
    # gate) must not suppress evidence from an already-staged Windows x64 app.
    # If x64 itself failed, the artifact download below fails visibly instead.
    if: ${{ inputs.mode == 'build' && always() && needs.preflight.result == 'success' && needs.build.result != 'cancelled' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        scenario:
          # og-parity-references stays a hard Linux gate; dropped from the advisory
          # Windows suite only (unclassified WebView2 trailing-space, AGENTS.md §2b
          # E2E stop-loss). See scripts/run-e2e.mjs windows-smoke suite for rationale.
          - windows-core
          - page-properties
          - page-trailing-block
          - pdf-logseq
          - print-security
          - tab-overflow
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          # Stage OUTSIDE the worktree. The E2E build receipt binds the app to the
          # clean-checkout build-input digest (git ls-files -co --untracked=all).
          # A download into the worktree adds untracked, non-ignored files that
          # poison that digest and make every advisory Windows scenario fail with
          # "built from different build inputs" — the Linux E2E runs inside the
          # build job, so it never hit this. `dist/` below is fine: it is gitignored.
          path: ${{ runner.temp }}/release-windows-x64
      - name: Download the exact embedded frontend proof
        uses: actions/download-artifact@v4
        with:
          name: release-e2e-frontend-windows-x64
          path: dist
      - name: Download the exact Windows x64 E2E receipt
        uses: actions/download-artifact@v4
        with:
          name: release-e2e-receipt-windows-x64
          path: ${{ runner.temp }}/tine-receipt
      - name: Extract the exact staged portable app
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP\release-windows-x64" -Filter '*-portable.zip' | Select-Object -First 1
          if (-not $zip) { throw "staged Windows portable zip is missing" }
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\tine-portable" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\tine-portable" -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw "portable Tine executable is missing" }
          "TINE_APP=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TINE_E2E_BUILD_RECEIPT=$env:RUNNER_TEMP\tine-receipt\tine.exe.build.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Edge WebDriver matching the WebView2 runtime
        shell: pwsh
        run: ./scripts/install-windows-webview2-driver.ps1
      - name: Run advisory Windows x64 real-app scenario
        env:
          TINE_E2E_MODE: release
        run: npm run e2e:windows:smoke -- --scenario=${{ matrix.scenario }}
      - name: Upload Windows E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-windows-x64-${{ matrix.scenario }}
          path: test-results/e2e/windows-smoke
          if-no-files-found: warn
          retention-days: 14

  # Android builds concurrently and contributes another immutable workflow
  # artifact. Signed Android output is mandatory for every release smoke/tag.
  #     The private signing key lives ONLY in encrypted repo secrets — never in the
  #     repo or on a build host (see docs/ANDROID-RELEASE.md). Add these once, on the
  #     machine that holds the .jks (Settings → Secrets, or `gh secret set`):
  #       ANDROID_KEYSTORE_BASE64    base64 of the .jks   (`base64 -w0 tine-release.jks`)
  #       ANDROID_KEYSTORE_PASSWORD  keystore password
  #       ANDROID_KEY_ALIAS          key alias (e.g. tine)
  #       ANDROID_KEY_PASSWORD       key password
  android:
    needs: preflight
    if: inputs.mode == 'build'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # secrets can't be used in a job-level `if:`, so gate every real step on this.
      # `secrets.X != ''` evaluates to a boolean without ever printing the secret.
      - name: Detect signing secret
        id: sign
        run: echo "enabled=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Require Android signing
        if: steps.sign.outputs.enabled != 'true'
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is required for release smoke and tagged releases."
          exit 1

      - uses: actions/setup-java@v4
        if: steps.sign.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        if: steps.sign.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: npm

      # Pinned to match the F-Droid build recipe EXACTLY (metadata/page.tine.app.yml
      # uses `rustup default 1.96.0`). Reproducible builds require the developer's
      # APK and F-Droid's rebuild to use the same compiler, so this must not drift
      # to `stable`. Bump both together.
      - uses: dtolnay/rust-toolchain@1.96.0
        if: steps.sign.outputs.enabled == 'true'
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        if: steps.sign.outputs.enabled == 'true'
        with:
          workspaces: ". -> target"

      # Match the local toolchain exactly (compileSdk 36; NDK 26.3.11579264).
      - name: Install Android SDK packages
        if: steps.sign.outputs.enabled == 'true'
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "platforms;android-35" \
            "build-tools;35.0.0" "ndk;26.3.11579264" "platform-tools" >/dev/null
          NDK="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          # Point EVERY NDK env var at 26.3 — incl. ANDROID_NDK_LATEST_HOME, which the
          # runner presets to a newer preinstalled NDK. Without this override, the
          # Android build linked with that newer NDK's clang/lld 21 instead of 26.3's
          # clang/lld 17, which is what F-Droid's recipe (`ndk: 26.3.11579264`) uses —
          # different linker ⇒ different .so layout ⇒ reproducibility verify fails.
          for v in NDK_HOME ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME; do
            echo "$v=$NDK" >> "$GITHUB_ENV"
          done
          # Env vars alone are NOT enough: the .so is linked by the tauri CLI (gradle's
          # RustPlugin shells out to `tauri android build`), which resolved a NEWER
          # preinstalled NDK's clang/lld 21 despite the env pin. Delete every other NDK
          # so 26.3 is the ONLY one anything can find — exactly the local (clang 17)
          # condition. With ndkVersion pinned in app/build.gradle.kts, AGP won't
          # re-download its default.
          find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d ! -name "26.3.11579264" -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$ANDROID_SDK_ROOT/ndk-bundle" 2>/dev/null || true
          echo "NDKs remaining on runner:"; ls "$ANDROID_SDK_ROOT/ndk"
          # Fail loudly if 26.3's clang isn't the one that'll be used.
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1

      - name: Install JS deps
        if: steps.sign.outputs.enabled == 'true'
        run: npm ci

      # Decode the keystore + write the gitignored signing config the Gradle build
      # reads. Both are removed in the final step regardless of outcome.
      - name: Write signing config from secrets
        if: steps.sign.outputs.enabled == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/tine-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/tine-release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > src-tauri/gen/android/keystore.properties

      # Stamp the APK's versionName/versionCode from tauri.conf.json so a version
      # bump always reaches the Android build (tauri.properties is autogenerated;
      # this makes the result deterministic regardless of whether the CLI resyncs
      # it). versionCode uses tauri's scheme: major*1e6 + minor*1e3 + patch.
      - name: Sync Android version from tauri.conf.json
        if: steps.sign.outputs.enabled == 'true'
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          IFS=. read -r MA MI PA <<< "$v"
          code=$(( 10#$MA * 1000000 + 10#$MI * 1000 + 10#$PA ))
          printf '// THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.\ntauri.android.versionName=%s\ntauri.android.versionCode=%s\n' "$v" "$code" \
            > src-tauri/gen/android/app/tauri.properties
          echo "Android version → $v (code $code)"

      # The desktop/Flatpak identifier is page.tine.Tine (Flathub forbids IDs ending
      # in .app), but Android deliberately keeps applicationId page.tine.app to protect
      # the F-Droid listing + installed users. `tauri android build` derives the Java
      # package path from tauri.conf.json's `identifier`, and the committed gen/android
      # project is page.tine.app — so with the desktop id in place the build looks for
      # java/page/tine/Tine and fails ("Project directory … does not exist"). Pin the
      # identifier back to page.tine.app for the Android build only (ephemeral checkout;
      # desktop jobs are unaffected). This is exactly how it built pre-rename (v0.5.0).
      - name: Pin Android identifier to page.tine.app
        if: steps.sign.outputs.enabled == 'true'
        run: |
          node -e "const f='./src-tauri/tauri.conf.json',c=require(f);c.identifier='page.tine.app';require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n');"
          echo "Android identifier → $(node -p "require('./src-tauri/tauri.conf.json').identifier")"

      - name: Build signed Android APK
        if: steps.sign.outputs.enabled == 'true'
        # Reproducible build (F-Droid #reproducible): canonicalize build-location paths
        # so the native lib's module-id hash matches F-Droid's rebuild regardless of
        # where each ran. Must stay identical to the RUSTFLAGS in the F-Droid recipe
        # (metadata/page.tine.app.yml). Paired with codegen-units=1 (Cargo.toml) and the
        # commit-time __BUILD_TIME__ (vite.config.ts).
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$HOME/.cargo=/cargo"
          npx tauri android build --target aarch64 --apk

      - name: Prepare canonical Android APK
        if: steps.sign.outputs.enabled == 'true'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # The signed artifact is app-universal-release.apk (the unsigned build
          # would end in -release-unsigned.apk, which this glob excludes).
          apk=$(find src-tauri/gen/android -path '*/release/*' -name '*-release.apk' | head -1)
          if [ -z "$apk" ]; then echo "no signed APK found"; exit 1; fi
          cp "$apk" "Tine_${version}_android-arm64.apk"

      # Android API < 30 does not export bionic's renameat2 wrapper. A source
      # check missed a second call in GH #192, so inspect the final linked .so
      # that users will actually load and fail the release before publication.
      - name: Verify Android 9 native-loader compatibility
        if: steps.sign.outputs.enabled == 'true'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          apk="Tine_${version}_android-arm64.apk"
          unzip -p "$apk" lib/arm64-v8a/libtine_lib.so > "$RUNNER_TEMP/libtine_lib.so"
          if readelf --dyn-syms --wide "$RUNNER_TEMP/libtine_lib.so" \
            | grep -Eq '[[:space:]]UND[[:space:]].*renameat2(@|$)'; then
            echo "::error::Android native library imports API-30 renameat2; it will not load on Android 9/API 28."
            exit 1
          fi
          readelf --dyn-syms --wide "$RUNNER_TEMP/libtine_lib.so" | grep -F 'syscall@' >/dev/null

      - name: Stage immutable Android artifact
        if: steps.sign.outputs.enabled == 'true'
        run: node scripts/stage-release-lane.mjs android release-candidate "${{ github.sha }}"

      - name: Upload Android release lane
        if: steps.sign.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-candidate/android
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/tine-release.jks" src-tauri/gen/android/keystore.properties

  # Merge immutable lane artifacts and generate latest.json exactly once. Manual
  # dispatch stops after uploading this verified candidate and never touches a
  # GitHub Release.
  assemble:
    needs: [preflight, flatpak, build, android]
    if: inputs.mode == 'build'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input
      - name: Assemble and verify complete candidate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/assemble-release-candidate.mjs release-input release-candidate-assembled --receipt release-candidate-receipt.json
      - name: Upload verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release-candidate-assembled
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Upload verified release candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-receipt
          path: release-candidate-receipt.json
          if-no-files-found: error
          retention-days: 3

  # The sole release writer. Expensive builds have already finished; this job
  # creates/reuses a draft, uploads distinct assets, uploads latest.json last,
  # re-downloads and verifies the draft, then publishes it.
  publish-release:
    needs: assemble
    if: inputs.mode == 'build' && inputs.publish && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release-candidate
      - name: Upload, verify, and publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release-candidate.mjs "${{ github.ref_name }}" release-candidate

  # Promotion is intentionally a second manual phase. It accepts only a
  # successful no-publication build run, proves that the intervening Git delta
  # is an explicitly registered real-app scenario edit, and reruns every proof
  # named by that registry against the exact preserved product binary.
  promotion-plan:
    needs: preflight
    if: inputs.mode == 'promote'
    runs-on: ubuntu-22.04
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      linux_required: ${{ steps.plan-status.outputs.linux_required }}
      windows_required: ${{ steps.plan-status.outputs.windows_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve source candidate commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          commit=$(gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source run did not identify a full Git commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-receipt
          path: promotion-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Verify source run and retained artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release-promotion-source.mjs \
            --run-id "${{ inputs.source_run_id }}" \
            --repo "${{ github.repository }}" \
            --source "${{ steps.source.outputs.commit }}" \
            --output promotion-source-evidence.json
      - name: Create proof-only promotion plan
        id: plan-status
        run: |
          node scripts/create-release-promotion-plan.mjs \
            --source "${{ steps.source.outputs.commit }}" \
            --target "${{ github.sha }}" \
            --source-run-id "${{ inputs.source_run_id }}" \
            --candidate-receipt promotion-source/release-candidate-receipt.json \
            --source-evidence promotion-source-evidence.json \
            --authorizer "${{ github.actor }}" \
            --output release-promotion-plan.json
          node -e 'const p=require("./release-promotion-plan.json"); const fs=require("fs"); const out=process.env.GITHUB_OUTPUT; fs.appendFileSync(out, `linux_required=${p.requiredProofs.some(x=>x.platform==="linux")}\nwindows_required=${p.requiredProofs.some(x=>x.platform==="windows")}\n`);'
      - uses: actions/upload-artifact@v4
        with:
          name: release-promotion-plan
          path: release-promotion-plan.json
          if-no-files-found: error
          retention-days: 14

  promotion-linux-proof:
    needs: promotion-plan
    if: inputs.mode == 'promote' && needs.promotion-plan.outputs.linux_required == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux real-app proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev webkit2gtk-driver xvfb xauth \
            xdotool openbox x11-utils weston
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: npm ci
      - run: cargo install tauri-driver --locked
      - uses: actions/download-artifact@v4
        with:
          name: release-promotion-plan
          path: ${{ runner.temp }}/release-promotion-plan
      - uses: actions/download-artifact@v4
        with:
          name: release-proof-linux-x64
          path: source-proof
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Select exact source binary and frontend
        run: |
          app=$(find source-proof -type f -path '*/target/release/tine' -print -quit)
          receipt=$(find source-proof -type f -name 'tine.build.json' -print -quit)
          frontend=$(find source-proof -type f -path '*/dist/index.html' -print -quit)
          if [ -z "$app" ] || [ -z "$receipt" ] || [ -z "$frontend" ]; then
            echo "::error::preserved Linux proof input is incomplete"
            exit 1
          fi
          chmod +x "$app"
          rm -rf dist
          cp -a "$(dirname "$frontend")" dist
          echo "TINE_APP=$GITHUB_WORKSPACE/$app" >> "$GITHUB_ENV"
          echo "TINE_E2E_BUILD_RECEIPT=$GITHUB_WORKSPACE/$receipt" >> "$GITHUB_ENV"
      - name: Rerun changed blocking proof against exact source binary
        run: |
          node scripts/run-release-promotion-proofs.mjs \
            --plan "${{ runner.temp }}/release-promotion-plan/release-promotion-plan.json" \
            --platform linux \
            --output promotion-linux-proofs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-promotion-linux-proof
          path: |
            promotion-linux-proofs.json
            test-results/release-promotion
          if-no-files-found: error
          retention-days: 14

  promotion-windows-proof:
    needs: promotion-plan
    if: inputs.mode == 'promote' && needs.promotion-plan.outputs.windows_required == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-promotion-plan
          path: ${{ runner.temp }}/release-promotion-plan
      - uses: actions/download-artifact@v4
        with:
          name: release-proof-windows-x64
          path: source-proof
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Select exact source binary and frontend
        shell: pwsh
        run: |
          $app = Get-ChildItem source-proof -Recurse -File -Filter tine.exe | Select-Object -First 1
          $receipt = Get-ChildItem source-proof -Recurse -File -Filter tine.exe.build.json | Select-Object -First 1
          $frontend = Get-ChildItem source-proof -Recurse -File -Filter index.html |
            Where-Object { $_.Directory.Name -eq 'dist' } | Select-Object -First 1
          if (-not $app -or -not $receipt -or -not $frontend) { throw 'preserved Windows proof input is incomplete' }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          Copy-Item $frontend.Directory.FullName dist -Recurse
          "TINE_APP=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TINE_E2E_BUILD_RECEIPT=$($receipt.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Edge WebDriver matching the WebView2 runtime
        shell: pwsh
        run: ./scripts/install-windows-webview2-driver.ps1
      - name: Rerun changed advisory proof against exact source binary
        shell: pwsh
        run: node scripts/run-release-promotion-proofs.mjs --plan "${{ runner.temp }}/release-promotion-plan/release-promotion-plan.json" --platform windows --output promotion-windows-proofs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-promotion-windows-proof
          path: |
            promotion-windows-proofs.json
            test-results/release-promotion
          if-no-files-found: error
          retention-days: 14

  promote-release:
    needs: [promotion-plan, promotion-linux-proof, promotion-windows-proof]
    if: ${{ always() && inputs.mode == 'promote' && needs.promotion-plan.result == 'success' && (needs.promotion-linux-proof.result == 'success' || needs.promotion-linux-proof.result == 'skipped') && (needs.promotion-windows-proof.result == 'success' || needs.promotion-windows-proof.result == 'skipped') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-promotion-plan
          path: promotion
      - uses: actions/download-artifact@v4
        if: needs.promotion-plan.outputs.linux_required == 'true'
        with:
          name: release-promotion-linux-proof
          path: promotion/linux
      - uses: actions/download-artifact@v4
        if: needs.promotion-plan.outputs.windows_required == 'true'
        with:
          name: release-promotion-windows-proof
          path: promotion/windows
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-receipt
          path: promotion/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Finalize and verify promotion receipt
        run: |
          args=(--plan promotion/release-promotion-plan.json --output release-promotion-receipt.json)
          if [ -f promotion/linux/promotion-linux-proofs.json ]; then
            args+=(--proof promotion/linux/promotion-linux-proofs.json)
          fi
          if [ -f promotion/windows/promotion-windows-proofs.json ]; then
            args+=(--proof promotion/windows/promotion-windows-proofs.json)
          fi
          node scripts/finalize-release-promotion.mjs "${args[@]}"
          node scripts/verify-release-promotion.mjs \
            --receipt release-promotion-receipt.json \
            --candidate-receipt promotion/source/release-candidate-receipt.json \
            --candidate release-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: release-promotion-receipt
          path: release-promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload, verify, and publish promoted release
        if: inputs.publish && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release-candidate.mjs "${{ github.ref_name }}" release-candidate
