name: ui-e2e

on:
  workflow_dispatch:
    inputs:
      linux_scenario:
        description: Optional single Linux scenario for focused debugging
        required: false
        default: ""
      windows_scenario:
        description: Optional single Windows scenario, or all, for focused debugging
        required: false
        default: ""
      managed_page_count:
        description: Note-page count for the focused Windows managed-storage receipt
        required: false
        default: "13000"
      managed_blocks_per_page:
        description: Blocks per ordinary page for the focused Windows managed-storage receipt
        required: false
        default: "10"
      managed_total_file_count:
        description: Total graph files including ignored assets for the focused Windows managed-storage receipt
        required: false
        default: "25890"
      managed_asset_logical_bytes:
        description: Logical bytes in the compact sparse asset for the focused Windows managed-storage receipt
        required: false
        default: "25200000000"
      managed_current_only:
        description: Activate and reopen the current candidate instead of the historical upgrade baseline
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  linux-release:
    name: Linux x64 real-app release suite
    if: ${{ inputs.windows_scenario == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev build-essential libssl-dev \
            webkit2gtk-driver xvfb xauth xdotool openbox x11-utils weston
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - name: Install browser used by the selection-wrap scenario
        run: npx playwright install --with-deps chromium
      - name: Snapshot Linux E2E candidate inputs
        run: node scripts/build-e2e-receipt.mjs before --snapshot target/release/tine.build.before.json
      - run: npm run build
      - name: Build production-protocol app
        run: cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Write Linux E2E candidate receipt
        run: node scripts/build-e2e-receipt.mjs after --snapshot target/release/tine.build.before.json --app target/release/tine
      # The whole suite's honesty rests on the build receipt: it is what proves
      # the binary under test is this checkout. Its own fixture test existed but
      # was called by no workflow and no npm script until 2026-08-17.
      - name: E2E build-provenance machinery is sound
        run: npm run test:e2e-provenance
      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --locked
      - name: Run complete Linux UI regression catalog
        env:
          E2E_ALLOW_SYNTHETIC_FOCUS: "1"
        run: |
          if [ -n "${{ inputs.linux_scenario }}" ]; then
            npm run e2e:linux:release -- --scenario=${{ inputs.linux_scenario }}
          else
            npm run e2e:linux:release
          fi
      - name: Upload Linux E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-linux-${{ github.run_attempt }}
          path: test-results/e2e/linux-release
          if-no-files-found: warn
          retention-days: 14

  windows-smoke:
    name: Windows x64 ${{ matrix.scenario }} real-app smoke
    if: ${{ inputs.linux_scenario == '' }}
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # og-parity-references stays a hard Linux gate; dropped from the advisory Windows
        # suite only (unclassified WebView2 trailing-space, AGENTS.md §2b E2E stop-loss).
        scenario: ${{ fromJSON((inputs.windows_scenario == '' || inputs.windows_scenario == 'all') && '["windows-core","page-properties","page-trailing-block","pdf-logseq","print-security","tab-overflow"]' || format('["{0}"]', inputs.windows_scenario)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - name: Snapshot Windows E2E candidate inputs
        run: node scripts/build-e2e-receipt.mjs before --snapshot target/release/tine.exe.build.before.json
      - run: npm run build
      - name: Build production-protocol app
        run: cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Write Windows E2E candidate receipt
        run: node scripts/build-e2e-receipt.mjs after --snapshot target/release/tine.exe.build.before.json --app target/release/tine.exe
      - name: Install Edge WebDriver matching the WebView2 runtime
        shell: pwsh
        run: ./scripts/install-windows-webview2-driver.ps1
      - name: Restore v0.6.94 Windows baseline for managed upgrade/reopen
        if: ${{ inputs.windows_scenario == 'windows-managed-storage' && inputs.managed_current_only != 'true' }}
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "Tine_0.6.94_x64-portable.zip"
          $baseline = Join-Path $env:RUNNER_TEMP "tine-v0.6.94"
          Invoke-WebRequest `
            -Uri "https://github.com/martinkoutecky/tine/releases/download/v0.6.94/Tine_0.6.94_x64-portable.zip" `
            -OutFile $archive
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($digest -ne "8dff47e5cd0ca3b4e967040c94e09efc2fb3c65b4fe1d6a2952fef73b9c997c7") {
            throw "v0.6.94 portable baseline digest mismatch: $digest"
          }
          Expand-Archive -Path $archive -DestinationPath $baseline
          $application = Get-ChildItem -Path $baseline -Recurse -Filter "Tine.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $application) { throw "v0.6.94 portable baseline did not contain Tine.exe" }
          "TINE_BASELINE_APP=$application" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run Windows WebView2 smoke
        env:
          TINE_APP: ${{ github.workspace }}\target\release\tine.exe
          E2E_MANAGED_PAGE_COUNT: ${{ inputs.managed_page_count }}
          E2E_MANAGED_BLOCKS_PER_PAGE: ${{ inputs.managed_blocks_per_page }}
          E2E_MANAGED_TOTAL_FILE_COUNT: ${{ inputs.managed_total_file_count }}
          E2E_MANAGED_ASSET_LOGICAL_BYTES: ${{ inputs.managed_asset_logical_bytes }}
          E2E_MANAGED_CURRENT_ONLY: ${{ inputs.managed_current_only }}
        run: npm run e2e:windows:smoke -- --scenario=${{ matrix.scenario }}
      - name: Upload Windows E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-windows-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: test-results/e2e/windows-smoke
          if-no-files-found: warn
          retention-days: 14

  windows-issue-295:
    name: Windows GH 295 literal page-reference keys
    if: ${{ inputs.windows_scenario == 'windows-page-reference-latency' && inputs.linux_scenario != '' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out measurement harness
        uses: actions/checkout@v4
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.linux_scenario }}
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            candidate/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "candidate -> candidate/target"
      - name: Restore exact candidate application
        id: candidate-app-cache
        uses: actions/cache/restore@v4
        with:
          path: candidate/target/release/tine.exe
          key: windows-gh295-candidate-${{ inputs.linux_scenario }}-rust-1.96.0-v1
      - name: Install harness dependencies
        run: npm ci
      - name: Install candidate dependencies
        if: steps.candidate-app-cache.outputs.cache-hit != 'true'
        working-directory: candidate
        run: npm ci
      - name: Build exact candidate frontend
        if: steps.candidate-app-cache.outputs.cache-hit != 'true'
        working-directory: candidate
        run: npm run build
      - name: Build exact candidate app
        if: steps.candidate-app-cache.outputs.cache-hit != 'true'
        working-directory: candidate
        run: cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Cache exact candidate application
        if: steps.candidate-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: candidate/target/release/tine.exe
          key: ${{ steps.candidate-app-cache.outputs.cache-primary-key }}
      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --locked
      - name: Install Edge WebDriver matching the WebView2 runtime
        shell: pwsh
        run: ./scripts/install-windows-webview2-driver.ps1
      - name: Fetch and authenticate the public GH 295 graph
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "anon-graph.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "anon-graph"
          Invoke-WebRequest -Uri "https://github.com/user-attachments/files/30858092/anon-graph.zip" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = "a4cc5eca0c08ac3e819dc490e3d48f545c207da742a670bf437a86a6d1b6aa24"
          if ($actual -ne $expected) { throw "public graph digest mismatch: $actual" }
          Expand-Archive -Path $archive -DestinationPath $expanded
          $graph = Get-ChildItem -Path $expanded -Directory -Recurse | Where-Object Name -eq "anon-test" | Select-Object -First 1
          if (-not $graph) { throw "anon-test graph directory is absent" }
          $candidateSha = git -C candidate rev-parse HEAD
          "TINE_295_PUBLIC_GRAPH=$($graph.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TINE_295_CANDIDATE_SHA=$candidateSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Drive literal page-reference keys and collect separated timings
        env:
          TINE_APP: ${{ github.workspace }}\candidate\target\release\tine.exe
          E2E_ARTIFACT_DIR: ${{ github.workspace }}\test-results\issue-295
        run: node scripts/e2e-windows-page-reference-latency.mjs
      - name: Upload GH 295 timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-issue-295-${{ github.run_attempt }}
          path: test-results/issue-295
          if-no-files-found: error
          retention-days: 30
